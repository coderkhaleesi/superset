# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request, surfacing known-vulnerable versions of the packages declared or updated in the PR. Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: "Dependency Review"
on:
  push:
    branches:
      - "master"
      - "[0-9].[0-9]*"
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          # compatible/incompatible licenses addressed here: https://www.apache.org/legal/resolved.html
          # find SPDX identifiers here: https://spdx.org/licenses/
          deny-licenses: MS-LPL, BUSL-1.1, QPL-1.0, Sleepycat, SSPL-1.0, CPOL-1.02, AGPL-3.0, GPL-1.0+, BSD-4-Clause-UC, NPL-1.0, NPL-1.1, JSON
          # pkg:npm/store2@2.14.2
          #   adding an exception for an ambigious license on store2, which has been resolved in
          #   the latest version. It's MIT: https://github.com/nbubna/store/blob/master/LICENSE-MIT
          # pkg:npm/node-forge@1.3.1
          #   selecting BSD-3-Clause licensing terms for node-forge to ensure compatibility with Apache
          allow-dependencies-licenses: pkg:npm/rgbcolor, pkg:npm/jszip@3.10.1

  python-dependency-liccheck:
    # NOTE: Configuration for liccheck lives in our pyproject.yml.
    # You cannot use a liccheck.ini file in this workflow.
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-backend/
        with:
          requirements-type: base

      - name: "Set up liccheck"
        # liccheck (0.9.2 is the latest release) still imports pkg_resources,
        # which setuptools 82.0.0 removed. Installing an older setuptools is not
        # an option: liccheck resolves requirements/base.txt against the
        # installed distributions, so the downgraded setuptools would conflict
        # with the setuptools pin it is checking. Instead, put just the
        # pkg_resources module from the last setuptools that shipped it on
        # PYTHONPATH, leaving the installed setuptools untouched. jaraco.text
        # and platformdirs are pkg_resources' own runtime imports.
        run: |
          uv pip install --system liccheck jaraco.text platformdirs
          uv pip install --target "${RUNNER_TEMP}/pkg_resources" --no-deps setuptools==81.0.0
          find "${RUNNER_TEMP}/pkg_resources" -maxdepth 1 -mindepth 1 \
            ! -name pkg_resources -exec rm -rf {} +
      - name: "Run liccheck"
        env:
          PYTHONPATH: ${{ runner.temp }}/pkg_resources
        run: |
          # run the checks
          liccheck -R output.txt
          # Print the report
          cat output.txt
